<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something Awesome is Brewing</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #0f0c20 0%, #15102a 50%, #060214 100%);
            color: #fff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            text-align: center;
        }

        /* Ambient Glowing Background Elements */
        .glow-orb {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,0,128,0.2) 0%, rgba(0,0,0,0) 70%);
            top: 20%;
            left: 20%;
            animation: floatOrb 8s infinite alternate ease-in-out;
            z-index: 1;
        }
        .glow-orb:nth-child(2) {
            background: radial-gradient(circle, rgba(0,255,255,0.15) 0%, rgba(0,0,0,0) 70%);
            top: 60%;
            left: 60%;
            animation: floatOrb 12s infinite alternate-reverse ease-in-out;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 30px) scale(1.2); }
        }

        /* Construction Tape Graphic Overlay */
        .tape-banner {
            background: repeating-linear-gradient(
                -45deg,
                #ffd700,
                #ffd700 20px,
                #111 20px,
                #111 40px
            );
            color: #111;
            font-weight: 900;
            padding: 12px 0;
            width: 120%;
            position: absolute;
            transform: rotate(-5deg);
            top: 10%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 1px 1px 0px #fff;
            animation: slideTape 20s linear infinite;
            white-space: nowrap;
            z-index: 2;
        }

        @keyframes slideTape {
            0% { background-position: 0 0; }
            100% { background-position: 400px 0; }
        }

        /* Main Glassmorphic Container */
        .container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem 2rem;
            border-radius: 24px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            z-index: 10;
            transform: scale(0.95);
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            to { transform: scale(1); }
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(45deg, #ff007f, #7f00ff, #00ffff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shineText 4s linear infinite;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        @keyframes shineText {
            to { background-position: 200% center; }
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #b0a8d3;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        /* Playful interactive trigger */
        .btn-panic {
            background: linear-gradient(135deg, #ff007f 0%, #7f00ff 100%);
            border: none;
            color: white;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 0, 127, 0.4);
            transition: all 0.3s ease;
            position: relative;
            outline: none;
        }

        .btn-panic:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 0, 127, 0.6);
        }

        .btn-panic:active {
            transform: translateY(1px);
        }

        /* Canvas Overlay for Confetti Particles */
        #confetti-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div class="glow-orb"></div>
    <div class="glow-orb"></div>

    <div class="tape-banner">
        &nbsp;&nbsp;⚠️ Plot Twist Imminent &nbsp;&nbsp;•&nbsp;&nbsp; 🚀 Something Wild is Cooking &nbsp;&nbsp;•&nbsp;&nbsp; ⚠️ Under Creative Construction &nbsp;&nbsp;•&nbsp;&nbsp; 🛠️ Sit Tight &nbsp;&nbsp;•&nbsp;&nbsp;
    </div>

    <div class="container">
        <h1>Hold Your Horses...</h1>
        <p class="subtitle">This space is currently undergoing a massive glow-up. The internet isn't ready for what's heading this way, but code is actively flying into place.</p>
        
        <button class="btn-panic" id="panicBtn">Do Not Push This Button</button>
    </div>

    <canvas id="confetti-canvas"></canvas>

    <script>
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        const button = document.getElementById('panicBtn');

        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 8 + 4;
                this.speedX = Math.random() * 10 - 5;
                this.speedY = Math.random() * -15 - 5;
                this.gravity = 0.4;
                this.color = `hsl(${Math.random() * 360}, 100%, 60%)`;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = Math.random() * 10 - 5;
            }
            update() {
                this.speedY += this.gravity;
                this.x += this.speedX;
                this.y += this.speedY;
                this.rotation += this.rotationSpeed;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation * Math.PI / 180);
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                ctx.restore();
            }
        }

        function spawnConfetti() {
            const rect = button.getBoundingClientRect();
            const startX = rect.left + rect.width / 2;
            const startY = rect.top + rect.height / 2;
            
            for(let i=0; i<60; i++) {
                particles.push(new Particle(startX, startY));
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for(let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if(particles[i].y > canvas.height) {
                    particles.splice(i, 1);
                }
            }
            requestAnimationFrame(animate);
        }

        button.addEventListener('click', () => {
            button.innerText = "Look what you did.";
            button.style.background = "linear-gradient(135deg, #00ffff 0%, #7f00ff 100%)";
            button.style.boxShadow = "0 5px 15px rgba(0, 255, 255, 0.4)";
            spawnConfetti();
            
            setTimeout(() => {
                button.innerText = "Push it again. See if I care.";
            }, 3000);
        });

        animate();
    </script>
</body>
</html>
